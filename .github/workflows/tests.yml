name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-19 and the ccm-validate run tests fail there.
    # Cyrus runs ccmagic on Debian bookworm (GNU coreutils 9.1), which 24.04 matches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The spec-only regression tests read the files at SPEC_BASELINE (tests/run.sh).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: openspec CLI
        # The spec-baseline fixture test validates its spec with it (RV-84).
        run: npm install -g @fission-ai/openspec@1.14.1 && openspec --version
      - name: shellcheck
        run: shellcheck -x bin/ccm-* hooks/*.sh tests/run.sh tests/relay-smoke.sh tests/stubs/gh evals/run.sh
      - name: docker
        # The ccm-harness tests skip without Docker; CI must never skip them.
        run: docker compose version && docker info --format '{{.ServerVersion}}'
      - name: tests
        run: bash tests/run.sh
